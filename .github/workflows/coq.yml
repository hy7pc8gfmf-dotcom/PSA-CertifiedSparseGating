name: Coq CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coq-build:
    name: Rocq 9.0 build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-flambda
          opam-disable-sandboxing: true
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      - name: Install Rocq 9.0 + mathcomp + Coquelicot
        run: |
          export OPAMSANDBOXING=disabled
          opam install -y coq.9.0.0 coq-mathcomp-ssreflect
          # Coquelicot 3.4.1 (<8.20) 不兼容 9.0；3.4.4 编译失败（Rocq 9.0 tactic 变更）。
          # dev 版（gitlab master）已适配 9.0；若 opam 无 dev 则回退 3.4.4 并在后处理补丁。
          opam install -y coq-coquelicot.dev || opam install -y coq-coquelicot.3.4.4

      - name: Run Coq build (lib chain + PSA core + audit)
        run: |
          eval "$(opam env)"
          bash scripts/ci_build.sh
