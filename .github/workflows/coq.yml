name: Coq CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coq-build:
    name: Rocq 9.0 build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-flambda
          opam-disable-sandboxing: true
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      - name: Install Rocq 9.0 + HB (Hierarchy-Builder)
        run: |
          export OPAMSANDBOXING=disabled
          opam install -y coq.9.0.0 coq-hierarchy-builder

      - name: Build vendored mathcomp (platform edition, 217 files)
        run: |
          eval "$(opam env)"
          COQLIB=$(coqc -where)
          HB="$COQLIB/user-contrib/HB"
          cd coq/deps/mathcomp
          for pass in $(seq 1 30); do
            progress=0
            for f in $(find . -name "*.v"); do
              b="${f%.v}"
              [ -f "$b.vo" ] && continue
              if coqc -Q . mathcomp -Q "$HB" HB "$f" 2>/tmp/mc_err; then progress=1; fi
            done
            [ "$progress" = "0" ] && break
          done
          n=$(find . -name "*.vo" | wc -l)
          echo "mathcomp compiled: $n .vo"
          [ "$n" -ge 200 ] || { echo "mathcomp build FAILED"; tail -30 /tmp/mc_err; exit 1; }

      - name: Build vendored Coquelicot (gitlab master, 24 files)
        run: |
          eval "$(opam env)"
          COQLIB=$(coqc -where)
          HB="$COQLIB/user-contrib/HB"
          cd coq/deps/coquelicot
          for pass in $(seq 1 15); do
            progress=0
            for f in theories/*.v; do
              b=$(basename "$f" .v)
              [ -f "theories/$b.vo" ] && continue
              if coqc -R theories Coquelicot -Q ../mathcomp mathcomp -Q "$HB" HB "$f" 2>/tmp/cq_err; then progress=1; fi
            done
            [ "$progress" = "0" ] && break
          done
          n=$(ls theories/*.vo 2>/dev/null | wc -l)
          echo "Coquelicot compiled: $n/24"
          [ "$n" = "24" ] || { echo "Coquelicot build FAILED"; tail -30 /tmp/cq_err; exit 1; }

      - name: Run Coq build (lib chain + PSA core + audit)
        run: |
          eval "$(opam env)"
          bash scripts/ci_build.sh
