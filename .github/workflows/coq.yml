name: Coq CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coq-build:
    name: Rocq 9.0 build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-flambda
          opam-disable-sandboxing: true
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      - name: Install Rocq 9.0 + mathcomp 2.5.0 (paired HB/elpi) + elpi
        run: |
          export OPAMSANDBOXING=disabled
          opam install -y coq.9.0.0 coq-mathcomp-ssreflect.2.5.0
          opam install -y coq-elpi

      - name: Cache vendored dependency .vo (Coquelicot only)
        uses: actions/cache@v4
        with:
          path: |
            coq/deps/coquelicot/**/*.vo
          key: ${{ runner.os }}-coquelicot-${{ hashFiles('coq/deps/coquelicot/**/*.v') }}

      - name: Build vendored Coquelicot (gitlab master, 24 files)
        run: |
          eval "$(opam env)"
          COQLIB=$(coqc -where)
          MC="$COQLIB/user-contrib/mathcomp"
          HB="$COQLIB/user-contrib/HB"
          ELPI="$COQLIB/user-contrib/elpi"
          cd coq/deps/coquelicot
          for pass in $(seq 1 15); do
            progress=0
            for f in theories/*.v; do
              b=$(basename "$f" .v)
              [ -f "theories/$b.vo" ] && continue
              if coqc -R theories Coquelicot -Q "$MC" mathcomp -Q "$HB" HB -Q "$ELPI" elpi "$f" 2>/tmp/cq_err; then progress=1; fi
            done
            [ "$progress" = "0" ] && break
          done
          n=$(ls theories/*.vo 2>/dev/null | wc -l)
          echo "Coquelicot compiled: $n/24"
          [ "$n" = "24" ] || { echo "Coquelicot build FAILED"; tail -30 /tmp/cq_err; exit 1; }

      - name: Run Coq build (lib chain + PSA core + audit)
        run: |
          eval "$(opam env)"
          bash scripts/ci_build.sh
