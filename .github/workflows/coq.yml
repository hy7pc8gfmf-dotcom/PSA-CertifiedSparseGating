name: Coq CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coq-build:
    name: Rocq 9.0 build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up OCaml/opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-flambda
          opam-disable-sandboxing: true
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      # ★ 2026-08-28：opam switch 完整缓存（coq 9.0 + mathcomp + elpi 编译产物）
      #   ——信任缓存：key 固定（依赖版本不变），恢复后 Install Rocq 步骤秒级跳过，
      #      消除 ~10 分钟 opam 源码编译开销（此前每次全量编译 >15 分钟）
      - name: Cache opam switch (coq+mathcomp+elpi compiled)
        uses: actions/cache@v5
        with:
          path: |
            ~/.opam/default
          key: ${{ runner.os }}-opam-switch-rocq90

      - name: Install Rocq 9.0 + mathcomp (rocq pkg) + elpi
        run: |
          export OPAMSANDBOXING=disabled
          eval "$(opam env)"
          echo "--- available rocq-mathcomp-ssreflect versions ---"
          opam list --available rocq-mathcomp-ssreflect 2>/dev/null || true
          echo "--- installing coq.9.0.0 + rocq-mathcomp-ssreflect + coq-elpi ---"
          opam install -y coq.9.0.0 rocq-mathcomp-ssreflect coq-elpi
          echo "--- mathcomp prime location check ---"
          COQLIB=$(coqc -where)
          ls "$COQLIB/user-contrib/mathcomp/ssreflect/prime.vo" 2>&1 || echo "NO ssreflect/prime"
          echo "--- find any prime* in mathcomp ---"
          find "$COQLIB/user-contrib/mathcomp" -iname "*prime*" 2>/dev/null | head -20
          echo "--- mathcomp top dirs ---"
          ls "$COQLIB/user-contrib/mathcomp" 2>/dev/null

      - name: Cache vendored dependency .vo (Coquelicot only)
        uses: actions/cache@v5
        with:
          path: |
            coq/deps/coquelicot/**/*.vo
          key: ${{ runner.os }}-coquelicot-${{ hashFiles('coq/deps/coquelicot/**/*.v') }}

      - name: Cache lib chain .vo (30 modules, mathcomp-boot CI variant)
        uses: actions/cache@v5
        with:
          path: |
            coq/lib/*.vo
            coq/lib/*.glob
          key: ${{ runner.os }}-libvo-${{ hashFiles('coq/lib/**/*.v', 'scripts/order.txt') }}

      - name: Cache merged .vo (E130 boot variant, sed-transformed)
        uses: actions/cache@v5
        with:
          path: |
            coq/merged/.ci/*.vo
            coq/merged/.ci/*.glob
          key: ${{ runner.os }}-mergedvo-${{ hashFiles('coq/merged/ca_merged_full_25.v') }}

      - name: Build vendored Coquelicot (gitlab master, 24 files)
        run: |
          eval "$(opam env)"
          COQLIB=$(coqc -where)
          MC="$COQLIB/user-contrib/mathcomp"
          HB="$COQLIB/user-contrib/HB"
          ELPI="$COQLIB/user-contrib/elpi"
          cd coq/deps/coquelicot
          for pass in $(seq 1 15); do
            progress=0
            for f in theories/*.v; do
              b=$(basename "$f" .v)
              [ -f "theories/$b.vo" ] && continue
              if coqc -R theories Coquelicot -Q "$MC" mathcomp -Q "$HB" HB -Q "$ELPI" elpi "$f" 2>/tmp/cq_err; then progress=1; fi
            done
            [ "$progress" = "0" ] && break
          done
          n=$(ls theories/*.vo 2>/dev/null | wc -l)
          echo "Coquelicot compiled: $n/24"
          [ "$n" = "24" ] || { echo "Coquelicot build FAILED"; tail -30 /tmp/cq_err; exit 1; }

      - name: Run Coq build (lib chain + PSA core + audit)
        run: |
          eval "$(opam env)"
          bash scripts/ci_build.sh

      # ★ 2026-08-29：GPG 签名认证（CI 流水线不会自动签名——必须显式导入私钥 + 配置 git + 用 -S 提交）
      #   私钥存于 GitHub Secrets：GPG_PRIVATE_KEY（必填）、GPG_PASSPHRASE（可选，私钥带口令时）
      #   公钥已存档：.github/gpg/psa-ci-public-key.asc（指纹 AE7C975FAE0BCD97）
      #   验证：签名提交在 GitHub 上显示 Verified 认证。
      #   注意：要让 GitHub 显示 Verified，公钥还必须注册到 GitHub 账号
      #         （Settings → SSH and GPG keys → New GPG key，粘贴 psa-ci-public-key.asc）。
      - name: Import GPG key and enable commit signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret 未配置——CI 提交将无 Verified 认证"
            exit 0
          fi
          # 1. 导入私钥
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # 2. 自动提取完整指纹（换钥后无需改脚本；硬编码短指纹易漂移）
          FPR=$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '/^fpr:/{print $10; exit}')
          if [ -z "$FPR" ]; then
            echo "::error::no secret key imported from GPG_PRIVATE_KEY"
            exit 1
          fi
          # 3. 口令预设（私钥带口令时；gpg-agent 缓存口令，git commit -S 免交互）
          if [ -n "$GPG_PASSPHRASE" ]; then
            KEYGRIP=$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '/^grp:/{print $10; exit}')
            if [ -n "$KEYGRIP" ]; then
              echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
              gpg-connect-agent reloadagent /bye >/dev/null 2>&1 || true
              PRESET=$(command -v gpg-preset-passphrase || echo /usr/lib/gnupg/gpg-preset-passphrase)
              echo "$GPG_PASSPHRASE" | "$PRESET" --preset "$KEYGRIP" || \
                echo "::warning::gpg-preset-passphrase 失败（私钥可能无口令，或路径不同）"
            fi
          fi
          # 4. 配置 Git：使用该密钥并开启签名
          git config --global user.signingkey "$FPR"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          # 签名提交需要身份（CI 环境默认无 user.name/user.email）
          git config --global user.name "PSA CI Bot"
          git config --global user.email "168888@live.cn"
          # 5. 自检：确实能签名（防"配置了但签不出"的静默失败）
          echo "gpg test $(date -u +%s)" | gpg --batch --clearsign >/dev/null 2>&1 \
            || echo "::warning::gpg 签名自检失败——提交签名可能无效"
          echo "GPG signing configured (fingerprint $FPR)"

      # 签名提交示例：CI 产生产物变更时用 -S 提交（无变更则跳过）。
      # push 需额外配置（contents: write 权限 + 显式 git push），默认不开启。
      # 注意：secrets 不能在 `if:` 条件中引用——经 env 传入后在脚本内判断。
      - name: Signed commit of CI artifacts (if any)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret 未配置——跳过签名提交"
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -S -m "ci: update build artifacts (signed)"
            echo "::notice::Signed commit created (Verified)"
          fi
